<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>render previews</title>
<style>
  body { font: 12px/1.5 monospace; padding: 16px; background: #fff; color: #111; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Certificate preview renderer</h1>
<pre id="log">starting...</pre>
<script src="vendor/pdfjs/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdfjs/pdf.worker.min.js";
  const logEl = document.getElementById("log");
  const log = (line) => { logEl.textContent += "\n" + line; };

  (async () => {
    const html = await fetch("index.html", { cache: "no-store" }).then((r) => r.text());
    const paths = [...new Set([...html.matchAll(/data-cert-pdf="([^"]+)"/g)].map((m) => m[1]))];
    log("found " + paths.length + " PDFs");

    for (let i = 0; i < paths.length; i++) {
      const path = paths[i];
      const name = path.split("/").pop().replace(/\.pdf$/i, "").toLowerCase();
      try {
        const pdf = await pdfjsLib.getDocument({ url: path }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 1.3 });
        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        const context = canvas.getContext("2d");
        await page.render({ canvasContext: context, viewport }).promise;
        const data = canvas.toDataURL("image/png");
        const res = await fetch("/__preview", {
          method: "POST",
          body: JSON.stringify({ name, data }),
        });
        log(`${i + 1}/${paths.length} ${name} HTTP ${res.status} ${Math.round(data.length / 1024)} KB`);
        canvas.width = 0;
        canvas.height = 0;
        pdf.destroy();
      } catch (error) {
        log(`ERROR ${name}: ${error.message || error}`);
      }
    }
    log("DONE");
    document.title = "DONE";
    document.body.dataset.done = "1";
  })();
</script>
</body>
</html>
